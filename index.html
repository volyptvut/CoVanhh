<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Có một lời yêu thương gửi tới bạn:))">
  <meta name="theme-color" content="#ffe6f2">
  <title>Em Hoàng giấu tên 10A1 gửi đến Cô Vân Anhhhhh </title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-soft: #fff0f6;
      --bg-mid: #ffd6e8;
      --bg-light: #ffe6f0;
      --card-bg: rgba(255, 255, 255, 0.96);
      --primary: #ff8fc8;
      --primary-dark: #d94f9b;
      --accent: #ffd6e8;
      --text: #3d2b47;
      --text-soft: #7a5e88;
      --shadow: 0 18px 50px rgba(217, 79, 155, 0.20);
      --glow: 0 0 25px rgba(255, 182, 220, 0.6);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: 'Quicksand', 'Segoe UI', Tahoma, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;

      background:
        radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.9), transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(255, 214, 232, 0.8), transparent 50%),
        radial-gradient(circle at 50% 85%, rgba(255, 182, 220, 0.6), transparent 60%),
        linear-gradient(160deg, #fcf1f7 0%, #fce4ef 30%, #f7c8e0 70%, #f0a8cb 100%);
      background-attachment: fixed;
      transition: all 0.5s ease;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 28% 42%, #fff0f5, transparent),
        radial-gradient(1.2px 1.2px at 47% 12%, #fff, transparent),
        radial-gradient(1.8px 1.8px at 65% 68%, #ffd6e8, transparent),
        radial-gradient(1.2px 1.2px at 82% 22%, #fff, transparent),
        radial-gradient(1.6px 1.6px at 90% 55%, #fff0f5, transparent),
        radial-gradient(1.3px 1.3px at 38% 78%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 72% 88%, #ffd6e8, transparent),
        radial-gradient(1.2px 1.2px at 8% 66%, #fff, transparent),
        radial-gradient(1.4px 1.4px at 55% 32%, #fff0f5, transparent);
      animation: twinkle 4s ease-in-out infinite alternate;
      opacity: 0.6;
    }

    @keyframes twinkle {
      0%   { opacity: 0.4; transform: scale(1); }
      100% { opacity: 0.8; transform: scale(1.03); }
    }

    .petal-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .petal {
      position: absolute;
      top: -60px;
      width: 22px;
      height: 22px;
      image-rendering: pixelated;
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform, opacity;
      filter: drop-shadow(0 0 3px rgba(255, 182, 220, 0.6));
    }

    .petal svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: crispEdges;
    }

    @keyframes fall {
      0% { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      50% { transform: translate3d(30px, 45vh, 0) rotate(180deg); }
      90% { opacity: 1; }
      100% { transform: translate3d(-20px, 110vh, 0) rotate(360deg); opacity: 0; }
    }

    /* ==================== PHẦN PHONG BÌ THƯ (ẢNH ONLINE) ==================== */
    .envelope-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .envelope-wrapper.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.8);
    }

    .envelope {
      width: 200px;
      max-width: 60vw;
      height: auto;
      display: block;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 15px 30px rgba(217, 79, 155, 0.4));
      transition: transform 0.3s ease, filter 0.3s ease;
      animation: float 3s ease-in-out infinite;
    }

    .envelope:hover {
      transform: scale(1.08) translateY(-5px);
      filter: drop-shadow(0 20px 40px rgba(217, 79, 155, 0.6));
    }

    /* Ảnh lỗi (fallback) */
    .envelope-fallback {
      width: 200px;
      max-width: 60vw;
      aspect-ratio: 160 / 110;
      background: linear-gradient(135deg, #ffb6dc, #ff8fc8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      box-shadow: 0 15px 30px rgba(217, 79, 155, 0.4);
      animation: float 3s ease-in-out infinite;
      cursor: pointer;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .envelope-text {
      font-family: 'Dancing Script', cursive;
      font-size: 1.6rem;
      color: var(--primary-dark);
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    /* ==================== NỘI DUNG CHÍNH ==================== */
    .main-content {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(30px);
      transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
    }

    .main-content.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 28px;
      box-shadow: var(--shadow), var(--glow);
      padding: 40px 32px 36px;
      text-align: center;
      border: 3px solid rgba(255, 255, 255, 0.85);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 8px;
      background: linear-gradient(90deg, #ffd6e8, #ff8fc8, #d94f9b);
    }

    .bee-intro {
      font-family: 'Dancing Script', cursive;
      font-size: 1.4rem;
      color: var(--primary-dark);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 14px 0 22px;
      color: var(--primary);
      font-size: 1rem;
      font-weight: 700;
    }
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      border-radius: 2px;
    }

    .banner {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff8fc8, #d94f9b);
      border-radius: 999px;
      padding: 10px 18px;
      display: inline-block;
      margin-bottom: 24px;
      border: 2px dashed rgba(255, 255, 255, 0.75);
      box-shadow: 0 6px 18px rgba(217, 79, 155, 0.35);
    }

    .letter {
      text-align: left;
      background: linear-gradient(160deg, #fffaff 0%, #fdebf5 100%);
      border-radius: 18px;
      padding: 26px 22px;
      border: 1px solid #ffc7e2;
      position: relative;
      box-shadow: inset 0 0 30px rgba(255, 182, 220, 0.15);
    }

    .letter .to {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary-dark);
      margin-bottom: 14px;
      display: block;
      min-height: 1.3em;
    }

    .letter p {
      margin-bottom: 14px;
      color: var(--text);
      font-size: 1rem;
      min-height: 1.65em;
    }
    .letter p:last-of-type { margin-bottom: 0; }

    .letter .from {
      margin-top: 22px;
      text-align: right;
      font-weight: 700;
      color: var(--text-soft);
      font-style: italic;
      min-height: 1.65em;
    }

    .hint {
      margin-top: 22px;
      font-size: 0.82rem;
      color: var(--text-soft);
      opacity: 0.9;
      min-height: 1.5em;
    }
    .hint em {
      color: var(--primary-dark);
      font-style: normal;
      font-weight: 600;
    }

    footer {
      position: relative;
      z-index: 2;
      margin-top: 24px;
      font-size: 0.8rem;
      color: rgba(61, 43, 71, 0.7);
      text-align: center;
    }

    .typing-cursor::after {
      content: "|";
      color: var(--primary-dark);
      font-weight: 400;
      animation: blink 0.8s step-start infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (max-width: 480px) {
      .card { padding: 30px 18px 26px; border-radius: 22px; }
      .letter { padding: 20px 16px; }
      .banner { font-size: 1rem; padding: 9px 14px; }
      .petal { width: 16px; height: 16px; }
      .envelope, .envelope-fallback { width: 150px; }
    }
  </style>
</head>
<body>

  <div class="stars" aria-hidden="true"></div>
  <div class="petal-layer" id="petalLayer" aria-hidden="true"></div>

  <!-- PHẦN NHẠC NỀN ĐÃ ĐƯỢC TÍCH HỢP -->
  <audio id="bgMusic" loop preload="auto" style="display:none;">
    <source src="https://raw.githubusercontent.com/volyptvut/CoVanhh/main/Drill.mp3" type="audio/mpeg">
  </audio>

  <!-- PHONG BÌ THƯ -->
  <div class="envelope-wrapper" id="envelopeWrapper">
    <img
      src="https://raw.githubusercontent.com/volyptvut/CoVanhh/refs/heads/main/envelope1.png"
      alt="Phong bì thư"
      class="envelope"
      id="envelope"
      draggable="false"
      onerror="handleImageError(this)"
    >
    <div class="envelope-text">Nhấn để mở thư</div>
  </div>

  <!-- NỘI DUNG CHÍNH -->
  <div class="main-content" id="mainContent">
    <main class="card" role="main">
      <p class="bee-intro">Lốp U</p>
      <div class="divider">💌</div>
      <h1 class="banner">Có một lời yêu thương gửi tới bạn 💌</h1>

      <div class="letter" id="typewriter-container">
        <span class="to" data-text="Gửi Cô Vân Anhhhhh,"></span>
        <p data-text="Cô trong mắt iem =)) : em thấy cô hay cười giống e, chắc cũng dễ tính giống e rá mà e cũng thấy thế=)"></p>
        <p data-text="Mong muốn bản thân: em thấy btvn hơi nhiều nhma vẫn còn tình người tại bài chưa khó. Còn bài kiểm tra 15p rất khó=)))"></p>
        <p data-text="Thôi thì chúc cô VanAnhhh có một ngày 20/11 tuyệt vờii, vẫn xinh như 20/11/2013 ạ:)"></p>
        <p class="from" data-text="Từ: Em Hoàng giấu tên 10A1"></p>
      </div>

      <p class="hint" id="hint-text" data-text="* Without AI."></p>
    </main>

    <footer>
      <p> 20/11/2026</p>
    </footer>
  </div>

  <script>
    // ==================== 1. HIỆU ỨNG HOA RƠI ====================
    (function () {
      const layer = document.getElementById('petalLayer');
      const petalSVG = `
        <svg viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="0" width="4" height="4" fill="#ffb6dc"/>
          <rect x="0" y="4" width="4" height="4" fill="#ffb6dc"/>
          <rect x="4" y="4" width="4" height="4" fill="#ff8fc8"/>
          <rect x="8" y="4" width="4" height="4" fill="#ffb6dc"/>
          <rect x="4" y="8" width="4" height="4" fill="#ffb6dc"/>
          <rect x="5" y="5" width="2" height="2" fill="#ffe6f2"/>
        </svg>
      `;
      const COLORS = ['#ffb6dc', '#ff8fc8', '#ffd6e8', '#ff9ed0'];

      function createPetal() {
        const petal = document.createElement('div');
        petal.className = 'petal';
        const size = 14 + Math.random() * 18;
        const left = Math.random() * 100;
        const duration = 8 + Math.random() * 10;
        const delay = Math.random() * 8;
        const hue = COLORS[Math.floor(Math.random() * COLORS.length)];

        petal.style.left = left + 'vw';
        petal.style.width = size + 'px';
        petal.style.height = size + 'px';
        petal.style.animationDuration = duration + 's';
        petal.style.animationDelay = '-' + delay + 's';
        petal.style.filter = `hue-rotate(${(Math.random() * 20 - 10).toFixed(1)}deg) drop-shadow(0 0 3px ${hue})`;

        petal.innerHTML = petalSVG;
        layer.appendChild(petal);
        setTimeout(() => {
          if (petal.parentNode) petal.parentNode.removeChild(petal);
        }, (duration + delay) * 1000);
      }

      const MAX_PETALS = 40;
      function spawnLoop() {
        if (layer.childElementCount < MAX_PETALS) {
          createPetal();
          createPetal();
        }
        setTimeout(spawnLoop, 600 + Math.random() * 400);
      }
      for (let i = 0; i < 12; i++) createPetal();
      spawnLoop();
    })();

    // ==================== 2. HIỆU ỨNG ĐÁNH MÁY ====================
    function startTypewriter() {
      const elements = document.querySelectorAll('[data-text]');
      let elementIndex = 0;
      let charIndex = 0;
      let isTyping = false;

      function typeNextChar() {
        if (elementIndex >= elements.length) return;

        const el = elements[elementIndex];
        const text = el.getAttribute('data-text');

        if (charIndex < text.length) {
          if (!isTyping) {
            el.classList.add('typing-cursor');
            isTyping = true;
          }
          el.textContent = text.substring(0, charIndex + 1);
          charIndex++;
          
          const speed = 30 + Math.random() * 30;
          setTimeout(typeNextChar, speed);
        } else {
          el.classList.remove('typing-cursor');
          isTyping = false;
          elementIndex++;
          charIndex = 0;
          
          if (elementIndex < elements.length) {
            setTimeout(typeNextChar, 500 + Math.random() * 400);
          }
        }
      }

      setTimeout(typeNextChar, 600);
    }

    // ==================== 3. XỬ LÝ ẢNH LỖI ====================
    function handleImageError(imgEl) {
      const fallback = document.createElement('div');
      fallback.className = 'envelope-fallback';
      fallback.id = 'envelope';
      fallback.textContent = '💌';
      imgEl.replaceWith(fallback);
      bindEnvelopeClick();
    }

    // ==================== 4. LOGIC MỞ THƯ VÀ PHÁT NHẠC ====================
    function bindEnvelopeClick() {
      const envelope = document.getElementById('envelope');
      if (!envelope) return;
      envelope.addEventListener('click', function() {
        const wrapper = document.getElementById('envelopeWrapper');
        const mainContent = document.getElementById('mainContent');
        const music = document.getElementById('bgMusic');

        // Phát nhạc khi click
        if (music) {
          music.volume = 0.6; // Âm lượng 60%
          music.play().catch(err => console.log('Trình duyệt chặn phát nhạc:', err));
        }

        wrapper.classList.add('hidden');
        mainContent.classList.add('show');

        setTimeout(startTypewriter, 500);
      });
    }
    bindEnvelopeClick();
  </script>

</body>
</html>
